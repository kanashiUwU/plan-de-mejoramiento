<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- 
    Aquí incrustamos la imagen real que tienes en tus archivos.
    Solo asegúrate de cambiar el atributo 'href' por el nombre o ruta 
    exacta de tu archivo de imagen (por ejemplo: 'fondo-logo.png' o 'logo-original.jpg').
  -->
  <image href="imagen.png" width="1200" height="675" preserveAspectRatio="xMidYMid slice" />
</svg>
